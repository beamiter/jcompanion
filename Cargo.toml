[workspace]
resolver = "2"
members = ["crates/companion-protocol", "crates/companion-core", "crates/companion-client", "daemon", "crates/companion-memory", "crates/companion-openai", "crates/eva-character-atlas"]
[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
companion-protocol = { path = "crates/companion-protocol" }
companion-core = { path = "crates/companion-core" }
companion-client = { path = "crates/companion-client" }
